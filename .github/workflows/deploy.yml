name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The mock login (functions/_shared/devLogin.ts) is local-only. It also
      # refuses non-localhost SITE_URLs and requests, but never let its flag
      # reach production config in the first place.
      - name: Guard against the dev-only mock login
        run: |
          if grep -n "DEV_LOGIN" wrangler.toml; then
            echo "::error file=wrangler.toml::DEV_LOGIN must never be set for production"
            exit 1
          fi
          if npx wrangler pages secret list --project-name te-op1 2>/dev/null | grep -q "DEV_LOGIN"; then
            echo "::error::DEV_LOGIN is set as a Pages secret; remove it with: wrangler pages secret delete DEV_LOGIN --project-name te-op1"
            exit 1
          fi

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply te-op1-db --remote

      - name: Deploy to Pages
        run: npx wrangler pages deploy ./dist --project-name te-op1 --branch master
